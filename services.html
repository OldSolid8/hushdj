<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务页 | DELTA CLUB</title>
  <meta name="description" content="三角洲行动护航、陪玩、趣味单服务价目表">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="logo">DELTA<span>CLUB</span></div>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="services.html" class="active">服务</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="page-head">
    <h1>服务</h1>
    <p>三角洲行动全部服务，按分类筛选，点击咨询即可联系。</p>
  </section>

  <div class="tabs" id="tabs"></div>

  <section class="grid" id="grid"></section>
</main>

<!-- 咨询弹窗 -->
<div class="modal" id="consultModal">
  <div class="modal-box">
    <h3 id="modalTitle">咨询</h3>
    <p class="sub" id="modalDesc"></p>
    <div id="modalQR" style="display:none;text-align:center;margin-bottom:14px;"></div>
    <div class="contact-row">
      <span>📱 微信号</span>
      <b id="modalWechat" style="cursor:pointer" title="点击复制"></b>
    </div>
    <div class="contact-row">
      <span>🐧 QQ</span>
      <b id="modalQQ" style="cursor:pointer" title="点击复制"></b>
    </div>
    <div class="order-form" id="orderForm" style="display:block;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);">
      <p style="font-size:14px;color:var(--text);margin-bottom:10px;">📝 提交订单</p>
      <input id="orderContact" type="text" placeholder="请输入联系方式（微信号/QQ）" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-soft);color:var(--text);font-size:13px;margin-bottom:8px;font-family:inherit;">
      <textarea id="orderRemark" placeholder="备注（可选）" rows="2" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-soft);color:var(--text);font-size:13px;resize:vertical;font-family:inherit;"></textarea>
      <button class="btn-consult" id="orderSubmit" style="width:100%;margin-top:10px;">提交订单</button>
      <p id="orderStatus" style="margin-top:8px;font-size:13px;text-align:center;"></p>
    </div>
    <button class="modal-close" id="modalClose">关闭</button>
  </div>
</div>

<script src="js/main.js"></script>

</body>
</html>
